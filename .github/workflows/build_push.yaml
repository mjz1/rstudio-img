name: Publish Docker images

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    # Monthly unconditional rebuild so rolling tags pick up new R patch
    # releases, Quarto, and apt-layer updates -- drift the RStudio-version
    # gate below cannot see
    - cron: '0 6 1 * *'
    # Weekly RStudio release check (Mondays). Builds only when Posit's stable
    # channel has moved past what the published `latest` image contains -- see
    # the `check` job. On a Monday the 1st both crons fire; the concurrency
    # group serialises them and the gated run then sees the fresh label and
    # skips.
    - cron: '0 6 * * 1'

env:
  LATEST_R_VERSION: '4.6'

# Serialise publishes, but never cancel one: a run killed partway through has
# pushed some tags to some registries and not others.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Resolves the current stable RStudio Server version once (the matrix jobs
  # consume it, so all four builds are guaranteed the same version even if
  # Posit releases mid-run), and decides whether this run should build at all.
  #
  # Only the weekly cron is gated: it skips the build when the published
  # `latest` image already contains the current RStudio release, read back
  # from the io.github.mjz1.rstudio-img.rstudio-server-version label without
  # pulling the image. Releases, manual dispatches, and the monthly rebuild
  # always build. The gate fails open -- a missing image, missing label
  # (pre-label images), or registry error all read as empty and trigger a
  # build, so the worst failure mode is an unnecessary rebuild, never a
  # missed release.
  check:
    name: Resolve RStudio version and gate scheduled build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rstudio.outputs.version }}
      build: ${{ steps.gate.outputs.build }}
    steps:
      - name: Resolve latest stable RStudio Server version
        id: rstudio
        run: |
          effective_url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            "https://rstudio.org/download/latest/stable/server/jammy/rstudio-server-latest-amd64.deb")
          filename=$(basename "$effective_url")
          version=${filename#rstudio-server-}
          version=${version%-amd64.deb}
          version=${version/-/+}
          echo "Resolved RStudio Server version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to build
        id: gate
        env:
          CURRENT: ${{ steps.rstudio.outputs.version }}
          WEEKLY: ${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1' }}
        run: |
          if [ "$WEEKLY" != "true" ]; then
            echo "Not the weekly release check; building unconditionally."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published=$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:latest" \
            --format '{{ index .Image.Config.Labels "io.github.mjz1.rstudio-img.rstudio-server-version" }}' \
            || true)
          echo "Published: '${published}'  Current stable: '${CURRENT}'"
          if [ "$published" = "$CURRENT" ]; then
            echo "Published latest already contains ${CURRENT}; skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New RStudio Server release detected; building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint Dockerfile and Scripts
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.build == 'true'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      
      # DL3008 is suppressed inline in the Dockerfile where it applies, so the
      # workflow-level ignore is redundant. Keeping the two lint invocations
      # identical means PR validation cannot pass where publish would fail.
      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      
      - name: Lint shell scripts with shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install_quarto_latest.sh

  push_to_registry:
    name: Push Docker image for R ${{ matrix.r_version }}
    runs-on: ubuntu-latest
    needs: [check, lint]
    strategy:
      fail-fast: false
      matrix:
        r_version: ["4.3", "4.4", "4.5", "4.6"]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      # Every rule here runs once per matrix entry, so any rule NOT keyed on
      # `matrix.r_version` is pushed by all four jobs and the last to finish
      # wins. Two rules had exactly that bug, and it shipped in v1.2.0:
      #
      #   * `type=ref,event=tag` emits the bare release tag (e.g. `v1.2.0`) from
      #     every job, so it ended up pointing at whichever R version pushed
      #     last -- and the two registries raced to different winners.
      #   * `flavor: latest=auto` is metadata-action's DEFAULT. It appends
      #     `latest` whenever `type=ref,event=tag` matches a semver tag, in every
      #     job, regardless of the explicit `type=raw,value=latest` rule below
      #     being correctly disabled. `latest=false` turns that off so only the
      #     explicit, guarded rule can produce `latest`.
      #
      # Both are now keyed on LATEST_R_VERSION: only the R 4.6 job emits the bare
      # release tag and `latest`.
      #
      # The rolling `4.x` and `latest` tags are additionally guarded against
      # refs/heads/dev: a workflow_dispatch run from the dev branch would
      # otherwise move them onto a dev build, and those are the tags downstream
      # consumers (and our HPC sync) actually pull. Keep new rules guarded.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            zatzmanm/rstudio
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag,enable=${{ matrix.r_version == env.LATEST_R_VERSION }}
            type=raw,value=${{ github.ref_name }}-r${{ matrix.r_version }},enable=${{ github.event_name != 'schedule' }}
            type=raw,value=${{ matrix.r_version }},enable=${{ github.ref != 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ matrix.r_version == env.LATEST_R_VERSION && github.ref != 'refs/heads/dev' }}
            type=raw,value=${{ matrix.r_version }}-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' && matrix.r_version == env.LATEST_R_VERSION }}
        
      # Build once and load the image into the local Docker daemon. Pushing is
      # handled as a separate step so a transient registry hiccup can't corrupt
      # the build cache mid-export (previously seen as
      # "cache entry no longer exists" after "use of closed network connection").
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            R_VERSION=${{ matrix.r_version }}
            RSTUDIO_VERSION=${{ needs.check.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push every tag with retries + backoff. All tags reference the same
      # locally-built image, so both registries receive identical digests.
      - name: Push Docker images with retry
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -u
          fail=0
          for tag in $TAGS; do
            pushed=0
            for attempt in 1 2 3 4 5; do
              if docker push "$tag"; then
                pushed=1
                break
              fi
              wait=$((attempt * 15))
              echo "::warning::push failed for ${tag} (attempt ${attempt}/5); retrying in ${wait}s"
              sleep "$wait"
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::giving up on ${tag} after 5 attempts"
              fail=1
            fi
          done
          exit $fail