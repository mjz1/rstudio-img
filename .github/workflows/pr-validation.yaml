name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# A second push to the same PR supersedes the first; four 15-minute matrix
# builds do not need to run twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Dockerfile and Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      
      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      
      - name: Lint shell scripts with shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install_quarto_latest.sh ci/*.sh

  build:
    name: Build image (R ${{ matrix.r_version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        r_version: ["4.3", "4.4", "4.5", "4.6"]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Resolve latest stable RStudio Server version
        id: rstudio
        run: |
          effective_url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            "https://rstudio.org/download/latest/stable/server/jammy/rstudio-server-latest-amd64.deb")
          filename=$(basename "$effective_url")
          version=${filename#rstudio-server-}
          version=${version%-amd64.deb}
          version=${version/-/+}
          echo "Resolved RStudio Server version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false            # Avoid loading into Docker to reduce disk use
          build-args: |
            R_VERSION=${{ matrix.r_version }}
            RSTUDIO_VERSION=${{ steps.rstudio.outputs.version }}
          tags: rstudio-pr-validate:${{ matrix.r_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Building an image proves it compiles. It does not prove it runs, and every
  # serious bug this repo has shipped was a runtime failure behind a green build:
  # an unreadable database.conf, a baked secure-cookie-key, TinyTeX installed
  # into a 0700 /root. Each of those is caught below, in seconds.
  #
  # The image is exercised ROOTLESS (uid 1000, rocker's `rstudio` user), because
  # that is how it is actually used -- Singularity on HPC, `podman run --user`,
  # OpenShift. Running as root would pass while the real deployment breaks.
  smoke:
    # The `env` context is not available in a job's `name`, so this is literal.
    name: Runtime smoke test (R 4.6, rootless)
    runs-on: ubuntu-latest
    needs: lint
    env:
      SMOKE_R_VERSION: '4.6'
      IMAGE: rstudio-smoke:test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Resolve latest stable RStudio Server version
        id: rstudio
        run: |
          effective_url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            "https://rstudio.org/download/latest/stable/server/jammy/rstudio-server-latest-amd64.deb")
          filename=$(basename "$effective_url")
          version=${filename#rstudio-server-}
          version=${version%-amd64.deb}
          version=${version/-/+}
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `load: true` is the point: the image must exist in the daemon to be run.
      # The gha cache is already warm from the build job, so this is cheap.
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            R_VERSION=${{ env.SMOKE_R_VERSION }}
            RSTUDIO_VERSION=${{ steps.rstudio.outputs.version }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha

      # The smoke checks live in ci/ and are SHARED with the publish workflow,
      # which runs them between build and push -- an image cannot pass review
      # under one set of checks and ship under another. See each script for
      # the history behind its assertions.
      #
      # Piped over stdin, not bind-mounted: a mount over /var/lib/rstudio-server
      # would mask the very file the script asserts does not exist.
      - name: Image invariants (rootless, unmounted)
        run: docker run --rm -i --user 1000:1000 "$IMAGE" bash -s < ci/smoke_invariants.sh

      # Starts rserver with the downstream OnDemand app's exact flag set and
      # asserts the sign-in page is served. Subsumes the old
      # `rserver --verify-installation` check: this starts rserver for real.
      - name: rserver serves sign-in with the OnDemand flag set
        run: ci/smoke_launch.sh

      - name: Headless Chrome renders (rootless)
        run: ci/smoke_chrome.sh

      - name: Quarto renders a PDF
        run: ci/smoke_quarto.sh
